name: Notify Blog Hub of discussion activity

on:
  discussion_comment:
    types: [created, deleted]

permissions:
  contents: read

jobs:
  notify:
    if: github.repository != 'gitblogapp/vanilla-gitblog-template-dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Send optional comment hint
        continue-on-error: true
        run: node ./scripts/send-hub-hint.mjs discussion-comment
